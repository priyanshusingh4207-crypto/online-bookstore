<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body class="frame-body content-bg">
    <h2 style="text-align: center; margin-bottom: 20px;">Your Shopping Cart</h2>
    <table>
        <thead>
            <tr>
                <th>Book Image</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Price</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-body"></tbody>
    </table>

    <div class="total-container">
        Total Price: Rs. <span id="cart-total">0</span>
        <br>
        <button class="btn-checkout" type="button">Proceed to Checkout</button>
    </div>
</body>
</html>
