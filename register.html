<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="frame-body content-bg">
    <div class="form-container" style="max-width: 500px;">
        <h2>Registration Page</h2>
        <form>
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile No.</label>
                <input type="text" id="mobile" name="mobile" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword" name="cpassword" required>
            </div>
            <div class="form-group">
                <label>Sex</label>
                <div class="radio-group">
                    <label><input type="radio" name="sex" value="male"> Male</label>
                    <label><input type="radio" name="sex" value="female"> Female</label>
                    <label><input type="radio" name="sex" value="other"> Other</label>
                </div>
            </div>
            <div class="form-group">
                <label>Date of Birth:</label>
                <div style="display: flex; gap: 10px;">
                    <select name="day">
                        <option value="">Day</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <select name="month">
                        <option value="">Month</option>
                        <option value="Jan">Jan</option>
                        <option value="Feb">Feb</option>
                        <option value="Mar">Mar</option>
                    </select>
                    <select name="year">
                        <option value="">Year</option>
                        <option value="2004">2004</option>
                        <option value="2005">2005</option>
                        <option value="2006">2006</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Languages Known</label>
                <div class="checkbox-group" style="flex-wrap: wrap;">
                    <label><input type="checkbox" name="lang" value="English"> English</label>
                    <label><input type="checkbox" name="lang" value="Hindi"> Hindi</label>
                    <label><input type="checkbox" name="lang" value="Telugu"> Telugu</label>
                    <label><input type="checkbox" name="lang" value="Tamil"> Tamil</label>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your address here"></textarea>
            </div>
            <button type="submit" class="btn-submit">Register</button>
        </form>
    </div>
</body>
</html>
